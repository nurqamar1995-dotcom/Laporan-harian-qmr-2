<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan & Monitoring Toko Harian</title>
    <style>
        :root { --primary: #0f766e; --bg: #f1f5f9; --card-bg: #ffffff; --text-dark: #1e293b; --border: #cbd5e1; --accent-bg: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text-dark); margin: 0; padding: 12px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header-title { text-align: center; background: linear-gradient(135deg, #0f766e, #0284c7); color: white; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .watermark { font-size: 0.75em; opacity: 0.85; font-style: italic; margin-bottom: 2px; }
        .header-title h2 { margin: 0; font-size: 1.3em; }
        .tab-nav { display: flex; gap: 6px; margin-bottom: 14px; }
        .tab-btn { flex: 1; padding: 10px; background-color: #e2e8f0; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; }
        .tab-btn.active { background-color: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; }
        .section-title { font-weight: 700; font-size: 0.95em; color: var(--primary); border-bottom: 2px solid #ccfbf1; padding-bottom: 6px; margin-bottom: 12px; }
        .form-group { margin-bottom: 10px; }
        label { font-size: 0.82em; font-weight: 600; margin-bottom: 4px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-primary { background-color: #10b981; color: white; }
        .btn-wa { background-color: #25d366; color: white; }
        .btn-secondary { background-color: #0284c7; color: white; }
        .btn-excel { background-color: #059669; color: white; }
        .preview-box { white-space: pre-wrap; background: #1e293b; color: #38bdf8; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.88em; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8em; text-align: center; }
        th { background-color: var(--primary); color: white; padding: 8px; }
        td { padding: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <div class="watermark">By : Qmr</div>
        <h2>📊 Laporan Toko Harian</h2>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('tab-laporan', this)">📝 Input Laporan</button>
        <button class="tab-btn" onclick="switchTab('tab-monitoring', this)">📊 Monitoring PPS</button>
    </div>

    <div id="tab-laporan" class="tab-content active">
        <div class="card">
            <div class="form-group">
                <label>Tanggal</label> <input type="text" id="tgl" oninput="hitung()">
            </div>
            <div class="form-group">
                <label>Kode Toko</label> <input type="text" id="kode_toko" oninput="saveKodeToko(); hitung()">
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Shift</label><select id="shift" onchange="hitung()"><option value="1">Shift 1</option><option value="2">Shift 2</option><option value="3">Shift 3</option></select></div>
                <div class="form-group"><label>Crew</label><input type="text" id="crew" oninput="hitung()"></div>
            </div>
            <div class="form-group"><label>Actual PSM</label><input type="text" id="actual_psm" oninput="hitung()"></div>
            <div class="form-group"><label>Actual PWP</label><input type="text" id="actual_pwp" oninput="hitung()"></div>
            <div class="form-group"><label>Actual Sergas</label><input type="text" id="actual_sergas" oninput="hitung()"></div>
            <div class="form-group"><label>Actual Segarr</label><input type="text" id="actual_segarr" oninput="hitung()"></div>
            <div class="form-group"><label>Actual New Mbr</label><input type="text" id="actual_new_mbr" oninput="hitung()"></div>
        </div>
        <div class="card">
            <div class="preview-box" id="preview"></div>
            <button class="btn btn-primary" onclick="copyWA()">📋 Copy Laporan</button>
            <button class="btn btn-wa" onclick="shareToWA()">📱 Kirim WhatsApp</button>
        </div>
    </div>

    <div id="tab-monitoring" class="tab-content">
        <div class="card">
            <button class="btn btn-excel" onclick="exportToExcel()">📋 Copy Format Excel</button>
            <button class="btn btn-secondary" onclick="fetchOnlineMonitoringTable()">🔄 Refresh Data</button>
            <div class="table-responsive" style="margin-top:10px;">
                <table id="monitoringTable">
                    <thead><tr><th>Tgl</th><th>Shift</th><th>PSM</th><th>PWP</th><th>Sergas</th><th>Segarr</th><th>New Mbr</th></tr></thead>
                    <tbody id="monitoringTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfAJwDgwKZh_iL19zyngJAeG7-MwynNsmVJlCkzRLBt5AnKq8lxci4PEjPe-FUum8i/exec";

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
        if (tabId === 'tab-monitoring') fetchOnlineMonitoringTable();
    }

    function saveKodeToko() { localStorage.setItem("saved_kode_toko", document.getElementById("kode_toko").value); }

    function hitung() {
        let text = `Tgl ${document.getElementById("tgl").value}\nKode Toko: ${document.getElementById("kode_toko").value}\nShift: ${document.getElementById("shift").value}\nCrew: ${document.getElementById("crew").value}\nPSM: ${document.getElementById("actual_psm").value}\nPWP: ${document.getElementById("actual_pwp").value}`;
        document.getElementById("preview").innerText = text;
    }

    function saveToOnline() {
        let data = {
            kode_toko: document.getElementById("kode_toko").value,
            tgl: document.getElementById("tgl").value,
            shift: document.getElementById("shift").value,
            crew: document.getElementById("crew").value,
            psm: document.getElementById("actual_psm").value,
            pwp: document.getElementById("actual_pwp").value,
            sergas: document.getElementById("actual_sergas").value,
            segarr: document.getElementById("actual_segarr").value,
            new_mbr: document.getElementById("actual_new_mbr").value
        };
        fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: "no-cors", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data) });
    }

    function shareToWA() { saveToOnline(); window.location.href = "whatsapp://send?text=" + encodeURIComponent(document.getElementById("preview").innerText); }
    function copyWA() { saveToOnline(); navigator.clipboard.writeText(document.getElementById("preview").innerText); alert("Data tersimpan & tercopy!"); }

    function fetchOnlineMonitoringTable() {
        let kt = document.getElementById("kode_toko").value;
        fetch(`${GOOGLE_SCRIPT_URL}?kode_toko=${encodeURIComponent(kt)}`)
            .then(res => res.json())
            .then(data => {
                let tbody = document.getElementById("monitoringTableBody");
                tbody.innerHTML = data.map(item => `<tr><td>${item.tgl}</td><td>${item.shift}</td><td>${item.psm}</td><td>${item.pwp}</td><td>${item.sergas}</td><td>${item.segarr}</td><td>${item.new_mbr}</td></tr>`).join("");
            });
    }

    function exportToExcel() {
        let table = document.getElementById("monitoringTable");
        let text = "";
        for (let row of table.rows) {
            let cols = Array.from(row.cells).map(cell => cell.innerText);
            text += cols.join("\t") + "\n";
        }
        navigator.clipboard.writeText(text);
        alert("Data tersalin! Buka Excel/Sheets lalu PASTE (Tempel).");
    }

    document.addEventListener("DOMContentLoaded", () => {
        let d = new Date();
        document.getElementById("tgl").value = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
        document.getElementById("kode_toko").value = localStorage.getItem("saved_kode_toko") || "";
    });
</script>
</body>
</html>
